[project]
name = "balatro-identity-service"
version = "0.1.0"
description = "Accounts and sign-in for Balatro: email + password, Google, RS256 access tokens with a JWKS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.1.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt[crypto]>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "TRY004"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "alembic"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["fakeredis", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
